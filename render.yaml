# Render Blueprint: 저장소를 연결하면 이 설정으로 웹 서비스가 만들어집니다.
services:
  - type: web
    name: preflight-brief
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false   # 값은 Render 화면에서 직접 넣습니다
